<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noxe | Trending Movies, TV Shows & Celebrities</title>

    <!-- Favicon -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />

    <!-- Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300&display=swap"
      />
    </noscript>

    <!-- Meta Tags -->
    <meta
      name="description"
      content="Discover trending movies, TV shows, and your favorite celebrities with Noxe — stay updated with the latest in entertainment."
    />
    <meta
      name="keywords"
      content="Noxe, trending movies, TV shows, celebrities, entertainment, cinema, streaming"
    />
    <meta name="author" content="Noxe Team" />

    <!-- Open Graph / Twitter (merged for compactness) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta
      property="og:title"
      content="Noxe | Trending Movies, TV Shows & Celebrities"
    />
    <meta
      property="og:description"
      content="Stay updated with the latest trending movies, TV shows, and stars with Noxe."
    />
    <meta property="og:image" content="https://yourdomain.com/preview.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noxe | Trending Movies & TV Shows" />
    <meta
      name="twitter:description"
      content="Discover trending movies, shows, and actors with Noxe."
    />
    <meta name="twitter:image" content="https://yourdomain.com/preview.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
